const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function unlock(pw) {
  const km = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey(
    { name:"PBKDF2", salt:b64(DATA.salt), iterations:300000, hash:"SHA-256" },
    km, { name:"AES-GCM", length:256 }, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({ name:"AES-GCM", iv:b64(DATA.nonce) }, key, b64(DATA.ct));
  return new TextDecoder().decode(pt);
}
async function go(pw, remember) {
  try {
    const html = await unlock(pw);
    if (remember) localStorage.setItem("zv_pw", pw);
    document.open(); document.write(html); document.close();
  } catch (e) {
    localStorage.removeItem("zv_pw");
    document.getElementById("err").textContent = "Onjuist wachtwoord — probeer opnieuw.";
  }
}
const saved = localStorage.getItem("zv_pw");
if (saved) go(saved, false);
document.getElementById("f").addEventListener("submit", ev => {
  ev.preventDefault(); go(document.getElementById("pw").value, true);
});
